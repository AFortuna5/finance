name: Atualizar edição publicada

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar fontes e salvar edição
        run: python scripts/update_news.py
      - name: Publicar dados atualizados no repositório
        run: |
          git config user.name 'meridiano-bot'
          git config user.email 'meridiano-bot@users.noreply.github.com'
          git add public/news.json public/history.json public/editions public/markets.json
          git diff --cached --quiet || git commit -m 'Atualizar edição do Meridiano'
          git push
