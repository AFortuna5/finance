name: Verificar código do jornal privado
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check public/app.js
      - run: node --check public/markets.js
      - run: node --check public/perfil.js
      - run: node --check public/gov.js
      - run: node --check public/feed-text.js
      - run: node --check public/i18n.js
      - run: node scripts/check-i18n.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/update_news.py
      - run: node scripts/test-data.mjs
