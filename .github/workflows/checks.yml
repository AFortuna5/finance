name: Verificar código do jornal privado
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check public/app.js
      - run: python3 -m py_compile scripts/update_news.py
      - run: node scripts/test-data.mjs
      - run: node scripts/prepare-ui.mjs
      - run: git diff --exit-code lib/journal-html.ts
